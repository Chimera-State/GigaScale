name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go-checks:
    name: Go checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "These files are not gofmt formatted:"
            echo "$files"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build binaries
        run: |
          go build ./cmd/backend
          go build ./cmd/gateway
          go build ./cmd/payment

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: go-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/backend/Dockerfile
          push: false
          tags: gigascale-backend:ci

      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/gateway/Dockerfile
          push: false
          tags: gigascale-gateway:ci

      - name: Build payment image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/payment/Dockerfile
          push: false
          tags: gigascale-payment:ci
